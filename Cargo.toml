[package]
name = "chessigma"
version = "0.1.0"
edition = "2021"
description = "Typed Rust client for the Chessigma public chess API: daily puzzles, Elo and game submissions"
license = "MIT"
homepage = "https://www.chessigma.com/developers"
repository = "https://github.com/mehdi-bh/chessigma-rust"
documentation = "https://docs.rs/chessigma"
readme = "README.md"
keywords = ["chess", "chessigma", "puzzles", "elo", "api"]
categories = ["api-bindings"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mockito = "1"
